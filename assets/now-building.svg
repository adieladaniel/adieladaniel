<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" width="860" height="200" role="img" aria-label="Currently building medreason-ai">
<title>Currently building: medreason-ai</title>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(3);opacity:0}}
@keyframes sweep{0%{transform:translateX(-200px)}100%{transform:translateX(860px)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
.sweep{animation:sweep 5s linear infinite}
.cur{animation:blink 1.1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{display:none}}
</style>
<defs>
<linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/><stop offset=".5" stop-color="#7dd3fc"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient>
<clipPath id="card"><rect width="860" height="200" rx="14"/></clipPath>
</defs>
<rect width="860" height="200" rx="14" fill="#0d1117"/>
<rect x=".75" y=".75" width="858.5" height="198.5" rx="13.5" fill="none" stroke="#2a3441" stroke-width="1.5"/>
<g clip-path="url(#card)"><rect class="sweep" x="0" y="197" width="200" height="3" fill="url(#sw)"/></g>
<circle class="ring" cx="34" cy="32" r="5" fill="#86efac"/>
