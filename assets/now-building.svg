<text x="28" y="100" font-size="14" fill="#d7dee8">Agentic multi-modal medical diagnostic assistant (chest X-ray + blood labs + radiology</text><text x="28" y="121" font-size="14" fill="#d7dee8">report -&gt; Normal/Pneumonia/Lung Cancer) with explainability and RAG evidence retrieval.</text>
